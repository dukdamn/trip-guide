<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>trip-guide 빌더</title>
  <meta name="description" content="MD로 쓰면 바로 모바일 여행 가이드 페이지가 되는 빌더">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- md2json.mjs 가 쓰는 js-yaml 을 브라우저에서 해석하기 위한 import map -->
  <script type="importmap">{ "imports": { "js-yaml": "https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.mjs" } }</script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif; }
    #editor { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "D2Coding", monospace; tab-size: 2; }
    .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
    .phone { width: 100%; }
    @media (min-width: 1024px) { .phone { width: 390px; } }
    @media (min-width: 1024px) { .pane { height: calc(100vh - 7.5rem); } }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased">

  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-3 py-2 flex items-center gap-2 flex-wrap">
      <a href="../" class="flex items-center gap-1.5 mr-1 shrink-0">
        <span class="text-xl">🧳</span><span class="font-black tracking-tight">trip-guide</span>
        <span class="text-[10px] font-bold text-teal-700 bg-teal-50 border border-teal-200 rounded px-1.5 py-0.5">빌더</span>
      </a>
      <div class="flex items-center gap-1.5 text-xs font-bold whitespace-nowrap overflow-x-auto no-scrollbar max-w-full order-3 lg:order-none w-full lg:w-auto">
        <div class="relative">
          <button id="btn-load" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200"><i class="fa-regular fa-folder-open mr-1"></i>불러오기</button>
          <div id="load-menu" class="hidden fixed w-48 bg-white border border-slate-200 rounded-xl shadow-lg p-1 z-40">
            <button data-sample="../templates/blank-trip.md" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-100">📄 빈 틀</button>
            <button data-sample="../trips/danang-2026.md" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-100">🇻🇳 다낭 예시 (4인)</button>
            <button data-sample="../trips/sample-osaka.md" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-100">🇯🇵 오사카 샘플 (2인)</button>
            <label class="block w-full text-left px-3 py-2 rounded-lg hover:bg-slate-100 cursor-pointer">💾 내 파일 열기 (.md)<input type="file" id="file-input" accept=".md,.txt,text/markdown" class="hidden"></label>
          </div>
        </div>
        <button id="btn-prompt" class="px-2.5 py-1.5 rounded-lg bg-violet-50 text-violet-700 hover:bg-violet-100"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>AI 프롬프트 복사</button>
        <button id="btn-geo" class="px-2.5 py-1.5 rounded-lg bg-amber-50 text-amber-800 hover:bg-amber-100"><i class="fa-solid fa-location-crosshairs mr-1"></i>지도 핀 채우기</button>
        <button id="btn-save-md" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200"><i class="fa-regular fa-file-lines mr-1"></i>MD 저장</button>
        <button id="btn-download" class="px-3 py-1.5 rounded-lg bg-teal-600 text-white hover:bg-teal-700 disabled:opacity-40"><i class="fa-solid fa-download mr-1"></i>HTML 다운로드</button>
      </div>
      <a href="https://github.com/dukdamn/trip-guide/blob/main/docs/md-format.md" target="_blank" rel="noopener" class="ml-auto text-xs font-bold text-slate-500 hover:text-teal-700"><i class="fa-regular fa-circle-question mr-1"></i>작성법</a>
    </div>
    <!-- 모바일: 편집 / 미리보기 전환 -->
    <nav class="lg:hidden flex border-t border-slate-100 text-xs font-bold">
      <button data-view="edit" class="view-tab flex-1 py-2.5 text-teal-700 border-b-2 border-teal-600">✏️ 편집</button>
      <button data-view="preview" class="view-tab flex-1 py-2.5 text-slate-500 border-b-2 border-transparent">📱 미리보기</button>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto p-3 grid lg:grid-cols-2 gap-3">
    <!-- 편집 -->
    <section id="pane-edit" class="pane flex flex-col gap-3 min-h-0 min-w-0">
      <div class="flex-1 min-h-[60vh] lg:min-h-0 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
        <div class="px-3 py-2 border-b border-slate-100 flex items-center justify-between text-[11px] text-slate-500">
          <span><i class="fa-brands fa-markdown mr-1"></i>여행 MD</span>
          <span id="cursor-pos">1행</span>
        </div>
        <textarea id="editor" spellcheck="false" class="flex-1 w-full p-3 text-[12.5px] leading-[1.6] resize-none outline-none" placeholder="불러오기 → 빈 틀로 시작하거나, AI 프롬프트를 복사해서 ChatGPT·Gemini·Claude에게 일정을 받아 붙여넣으세요."></textarea>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm max-h-56 overflow-y-auto">
        <div class="px-3 py-2 border-b border-slate-100 text-[11px] font-bold text-slate-600 flex items-center justify-between">
          <span>검사 결과</span><span id="summary" class="font-normal text-slate-500"></span>
        </div>
        <ul id="issues" class="text-xs divide-y divide-slate-100"></ul>
      </div>
    </section>

    <!-- 미리보기 -->
    <section id="pane-preview" class="pane hidden lg:flex flex-col items-center gap-2 min-h-0 min-w-0">
      <div class="phone flex-1 min-h-[75vh] lg:min-h-0 bg-white rounded-2xl border border-slate-200 lg:rounded-[2rem] lg:border-[6px] lg:border-slate-800 lg:shadow-xl overflow-hidden relative">
        <iframe id="preview" title="미리보기" class="w-full h-full block" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-modals"></iframe>
        <div id="preview-empty" class="absolute inset-0 flex items-center justify-center text-center text-xs text-slate-400 p-6 bg-slate-50">오류를 고치면 여기에 미리보기가 나와요</div>
      </div>
      <p class="text-[10px] text-slate-400">지도 핀 검색: © OpenStreetMap 기여자 · Nominatim</p>
    </section>
  </main>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity pointer-events-none"></div>

<script type="module">
import { parseTripMd } from '../tools/md2json.mjs';
import { COUNTRIES } from '../tools/countries.mjs';

const $ = (id) => document.getElementById(id);
const KEY_MD = 'trip-guide-builder:md', KEY_GEO = 'trip-guide-builder:geo';
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 저장 불가 환경 */ } },
};
function toast(msg, ms = 2000) { const t = $('toast'); t.textContent = msg; t.style.opacity = '1'; clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.opacity = '0'), ms); }
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- 템플릿 · 국가 팩 ----------
const templateP = fetch('../template.html').then(r => r.text());
const packCache = {};
async function getPack(code) {
  if (!/^[a-z]{2}$/.test(code ?? '')) return null;
  if (!(code in packCache)) packCache[code] = await fetch(`../packs/${code}.json`).then(r => (r.ok ? r.json() : null)).catch(() => null);
  return packCache[code];
}

// build-html.mjs 와 같은 방식으로 데이터를 박아 넣는다
function compose(template, trip, pack) {
  const inline = (o) => (o ? JSON.stringify(o).replace(/</g, '\\u003c') : '');
  return template
    .replace('<script type="application/json" id="trip-data"><\/script>', `<script type="application/json" id="trip-data">${inline(trip)}<\/script>`)
    .replace('<script type="application/json" id="pack-data"><\/script>', `<script type="application/json" id="pack-data">${inline(pack)}<\/script>`)
    .replace('<html lang="ko">', `<html lang="${trip.meta.lang ?? 'ko'}">`)
    .replace('<title>Travel Guide</title>', `<title>${esc(trip.meta.title)}</title>`);
}

// ---------- 지도 핀 (좌표 캐시) ----------
// 좌표 없는 일정 중 지도 링크가 있는 것만 대상. 결과는 MD를 고치지 않고 브라우저에 캐시해 두었다가 빌드 때 합친다.
function geoTargets(trip) {
  const out = [];
  const fallbackArea = trip.meta.cities?.[0] ?? COUNTRIES[trip.meta.country]?.en ?? '';
  trip.days.forEach(d => d.items.forEach(it => {
    if (!it.place || it.place.lat != null) return;
    const name = it.place.q ?? it.title;
    const area = (d.city ?? fallbackArea).split(/[·,]/)[0].trim();
    out.push({ it, query: `${name}${area && !name.includes(area) ? ', ' + area : ''}` });
  }));
  return out;
}
function applyGeo(trip) {
  const cache = ls.get(KEY_GEO, {});
  let filled = 0;
  for (const { it, query } of geoTargets(trip)) {
    const hit = cache[query];
    if (hit) { it.place.lat = hit.lat; it.place.lng = hit.lng; filled++; }
  }
  return filled;
}
function pinStats(trip) {
  const withPlace = trip.days.flatMap(d => d.items).filter(it => it.place);
  return { pins: withPlace.filter(it => it.place.lat != null).length, total: withPlace.length };
}

let geoRunning = false;
async function runGeocode() {
  if (geoRunning || !lastTrip) return;
  const cache = ls.get(KEY_GEO, {});
  const todo = [...new Map(geoTargets(structuredClone(lastTrip)).filter(t => !(t.query in cache)).map(t => [t.query, t])).values()].slice(0, 50);
  if (!todo.length) return toast('채울 핀이 없어요 (이미 찾았거나 좌표가 있어요)');
  geoRunning = true; $('btn-geo').disabled = true;
  let found = 0;
  for (let i = 0; i < todo.length; i++) {
    $('btn-geo').innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i>${i + 1}/${todo.length}`;
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=${lastTrip.meta.lang ?? 'ko'}&q=${encodeURIComponent(todo[i].query)}`;
      const res = await fetch(url, { headers: { Accept: 'application/json' } });
      const [hit] = res.ok ? await res.json() : [];
      cache[todo[i].query] = hit ? { lat: +(+hit.lat).toFixed(6), lng: +(+hit.lon).toFixed(6) } : null;
      if (hit) found++;
    } catch { /* 네트워크 오류: 캐시하지 않고 다음에 다시 시도 */ }
    ls.set(KEY_GEO, cache);
    if (i < todo.length - 1) await new Promise(r => setTimeout(r, 1100)); // Nominatim 이용 정책: 초당 1회
  }
  geoRunning = false; $('btn-geo').disabled = false;
  $('btn-geo').innerHTML = '<i class="fa-solid fa-location-crosshairs mr-1"></i>지도 핀 채우기';
  toast(`📍 ${todo.length}곳 중 ${found}곳 찾았어요${found < todo.length ? ' · 못 찾은 곳은 긴 구글맵 링크로 바꿔주세요' : ''}`, 3500);
  update();
}

// ---------- 검사 + 미리보기 ----------
let lastTrip = null, lastHtml = null, timer = null;
function lineLink(msg) {
  return esc(msg).replace(/^(\d+)행/, (m, n) => `<button class="font-mono font-bold underline decoration-dotted" data-line="${n}">${n}행</button>`);
}
async function update() {
  const src = $('editor').value;
  ls.set(KEY_MD, src);
  let res;
  try { res = parseTripMd(src, { packs: {} }); } catch (e) { res = { trip: null, errors: ['변환 중 오류: ' + e.message], warnings: [] }; }
  // 국가 팩을 불러와서 환율 기본값 등을 반영하려고 한 번 더 파싱
  const code = res.trip?.meta?.country;
  const pack = await getPack(code);
  if (pack) res = parseTripMd(src, { packs: { [code]: pack } });
  const { trip, errors, warnings } = res;
  const shown = warnings.filter(w => !/국가 팩/.test(w));
  if (trip && !pack && /^[a-z]{2}$/.test(code ?? '')) shown.push(`국가 팩(${code})이 아직 없어요 → 회화·현지 팁 없이 만들어져요`);

  if (trip && !errors.length) { applyGeo(trip); }
  const pins = trip && !errors.length ? pinStats(trip) : null;
  if (pins && pins.total) {
    const shortLinkWarn = shown.findIndex(w => /짧은 구글맵 링크/.test(w));
    if (shortLinkWarn >= 0) shown.splice(shortLinkWarn, 1);
    if (pins.pins < pins.total) shown.push(`지도 핀 ${pins.pins}/${pins.total} · 위의 [지도 핀 채우기]로 장소 이름을 검색해 채울 수 있어요`);
  }

  $('issues').innerHTML = [
    ...errors.map(e => `<li class="px-3 py-2 text-rose-700 bg-rose-50/60">❌ ${lineLink(e)}</li>`),
    ...shown.map(w => `<li class="px-3 py-2 text-amber-800">⚠️ ${lineLink(w)}</li>`),
  ].join('') || '<li class="px-3 py-2 text-teal-700">✅ 문제없어요</li>';

  if (trip && !errors.length) {
    const items = trip.days.reduce((s, d) => s + d.items.length, 0);
    $('summary').textContent = `${trip.meta.emoji ?? ''} ${trip.days.length}일 · 일정 ${items} · 장소 ${trip.places?.length ?? 0} · 예산 ${trip.budget?.items.length ?? 0}${pins?.total ? ` · 핀 ${pins.pins}/${pins.total}` : ''}`;
    lastTrip = trip;
    lastHtml = compose(await templateP, trip, pack);
    const frame = $('preview');
    const y = frame.contentWindow?.scrollY ?? 0;
    frame.onload = () => { try { frame.contentWindow.scrollTo(0, y); } catch { /* */ } };
    frame.srcdoc = lastHtml;
    $('preview-empty').classList.add('hidden');
    $('btn-download').disabled = false;
  } else {
    $('summary').textContent = '';
    lastTrip = null; lastHtml = null;
    $('preview-empty').classList.remove('hidden');
    $('btn-download').disabled = true;
  }
}
const schedule = () => { clearTimeout(timer); timer = setTimeout(update, 500); };

// ---------- 편집기 동작 ----------
const editor = $('editor');
editor.addEventListener('input', schedule);
function updateCursor() { $('cursor-pos').textContent = `${editor.value.slice(0, editor.selectionStart).split('\n').length}행`; }
editor.addEventListener('keyup', updateCursor); editor.addEventListener('click', updateCursor);
$('issues').addEventListener('click', (e) => {
  const n = +e.target.dataset?.line; if (!n) return;
  const lines = editor.value.split('\n');
  const start = lines.slice(0, n - 1).reduce((s, l) => s + l.length + 1, 0);
  editor.focus(); editor.setSelectionRange(start, start + (lines[n - 1]?.length ?? 0));
  const lh = parseFloat(getComputedStyle(editor).lineHeight) || 20;
  editor.scrollTop = Math.max(0, (n - 4) * lh);
  setView('edit'); updateCursor();
});

// ---------- 불러오기 ----------
$('btn-load').onclick = (e) => {
  e.stopPropagation();
  const r = $('btn-load').getBoundingClientRect(), m = $('load-menu');   // 가로 스크롤 툴바에 잘리지 않게 fixed로 띄움
  m.style.left = Math.min(r.left, innerWidth - 200) + 'px'; m.style.top = r.bottom + 4 + 'px';
  m.classList.toggle('hidden');
};
document.addEventListener('click', () => $('load-menu').classList.add('hidden'));
function setText(text) {
  if (editor.value.trim() && editor.value !== text && !confirm('지금 쓰던 내용을 바꿀까요? (먼저 [MD 저장]으로 받아둘 수 있어요)')) return;
  editor.value = text; editor.scrollTop = 0; update();
}
document.querySelectorAll('[data-sample]').forEach(b => b.onclick = async () => {
  const text = await fetch(b.dataset.sample).then(r => r.text()).catch(() => null);
  if (text == null) return toast('불러오지 못했어요');
  setText(text);
});
$('file-input').onchange = async (e) => { const f = e.target.files[0]; if (f) setText(await f.text()); e.target.value = ''; };

// ---------- 버튼 ----------
$('btn-prompt').onclick = async () => {
  const text = await fetch('../docs/ai-prompt.md').then(r => r.text()).catch(() => null);
  if (!text) return toast('프롬프트를 불러오지 못했어요');
  try { await navigator.clipboard.writeText(text); toast('복사했어요 → ChatGPT·Gemini·Claude에 붙여넣고 [여행 정보]를 채우세요', 3500); }
  catch { toast('복사가 막혔어요. docs/ai-prompt.md 를 열어 직접 복사해 주세요', 3500); }
};
$('btn-geo').onclick = runGeocode;
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const slug = () => (lastTrip?.meta.id || lastTrip?.meta.title || 'my-trip').toString().normalize('NFC')
  .replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '') || 'my-trip';
$('btn-download').onclick = () => { if (lastHtml) { download(`${slug()}.html`, lastHtml, 'text/html'); toast('다운로드했어요 · 카톡으로 보내면 폰에서 바로 열려요', 3000); } };
$('btn-save-md').onclick = () => download(`${slug()}.md`, editor.value, 'text/markdown');

// ---------- 모바일 탭 ----------
function setView(v) {
  if (window.matchMedia('(min-width: 1024px)').matches) return;
  $('pane-edit').classList.toggle('hidden', v !== 'edit');
  $('pane-preview').classList.toggle('hidden', v !== 'preview');
  $('pane-preview').classList.toggle('flex', v === 'preview');
  document.querySelectorAll('.view-tab').forEach(t => {
    const on = t.dataset.view === v;
    t.classList.toggle('text-teal-700', on); t.classList.toggle('border-teal-600', on);
    t.classList.toggle('text-slate-500', !on); t.classList.toggle('border-transparent', !on);
  });
}
document.querySelectorAll('.view-tab').forEach(t => t.onclick = () => {
  setView(t.dataset.view);
  if (t.dataset.view === 'preview' && lastHtml) $('preview').srcdoc = lastHtml;   // 숨김 상태에서 그려진 지도 크기 바로잡기
});

// ---------- 시작: 쓰던 내용 > 다낭 예시 ----------
const saved = ls.get(KEY_MD, null);
editor.value = saved ?? await fetch('../trips/danang-2026.md').then(r => r.text()).catch(() => '');
update();
</script>
</body>
</html>
